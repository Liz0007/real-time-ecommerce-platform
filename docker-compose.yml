# docker-compose.yml (repo root, or services/order-service/ for now — you'll
# move this up when you do the monorepo restructure)

services:
  postgres:
    image: postgres:16-alpine
    container_name: order-postgres
    environment:
      POSTGRES_DB: orders
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./services/order-service/migrations:/docker-entrypoint-initdb.d

  payment-postgres:
    image: postgres:16-alpine
    container_name: payment-postgres
    environment:
      POSTGRES_DB: payments
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5434:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
    volumes:
      - payment-postgres-data:/var/lib/postgresql/data
      - ./services/payment-service/migrations:/docker-entrypoint-initdb.d

  kafka:
    image: confluentinc/cp-kafka:7.7.1
    container_name: kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://kafka:29092,CONTROLLER://kafka:29093,PLAINTEXT_HOST://0.0.0.0:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:29093
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
    healthcheck:
      test: ["CMD", "kafka-broker-api-versions", "--bootstrap-server", "localhost:9092"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    volumes:
      - kafka-data:/var/lib/kafka/data

  kafka-init:
    image: confluentinc/cp-kafka:7.7.1
    container_name: kafka-init
    depends_on:
      kafka:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-c"]
    command: |
      "
      kafka-topics --bootstrap-server kafka:29092 --create --if-not-exists --topic order-created --partitions 3 --replication-factor 1
      kafka-topics --bootstrap-server kafka:29092 --create --if-not-exists --topic payment-processed --partitions 3 --replication-factor 1
      kafka-topics --bootstrap-server kafka:29092 --create --if-not-exists --topic inventory-reserved --partitions 3 --replication-factor 1
      echo 'Topics created:'
      kafka-topics --bootstrap-server kafka:29092 --list
      "

  order-service:
    build: ./services/order-service
    container_name: order-service
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@postgres:5432/orders
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      KAFKA_SECURITY_PROTOCOL: PLAINTEXT
    depends_on:
      postgres:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
  
  payment-service:
    build: ./services/payment-service
    container_name: payment-service
    ports:
      - "8001:8000"
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      KAFKA_SECURITY_PROTOCOL: PLAINTEXT
    depends_on:
      kafka-init:
        condition: service_completed_successfully

  inventory-service:
    build: ./services/inventory-service
    container_name: inventory-service
    ports:
      - "8002:8000"
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      KAFKA_SECURITY_PROTOCOL: PLAINTEXT
    depends_on:
      kafka-init:
        condition: service_completed_successfully

  notification-service:
    build: ./services/notification-service
    container_name: notification-service
    ports:
      - "8003:8000"
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      KAFKA_SECURITY_PROTOCOL: PLAINTEXT
    depends_on:
      kafka-init:
        condition: service_completed_successfully

  data-pipeline:
    build: ./data-pipeline
    container_name: data-pipeline
    ports:
      - "8004:8000"
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      KAFKA_SECURITY_PROTOCOL: PLAINTEXT
      SINK_MODE: local
      LOCAL_DATA_DIR: /data/lake
    volumes:
      - data-lake:/data/lake
    depends_on:
      kafka-init:
        condition: service_completed_successfully   

  load-generator:
    build: ./load-generator
    container_name: load-generator
    profiles: ["load-gen"]
    command: ["--url", "http://order-service:8000", "--rate", "1.0"]
    depends_on:
      order-service:
        condition: service_healthy

  ai-agent-service:
    build: ./services/ai-agent-service
    ports:
      - "8010:8000"
    environment:
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - LANGSMITH_TRACING=${LANGSMITH_TRACING}
      - LANGSMITH_API_KEY=${LANGSMITH_API_KEY}
      - LANGSMITH_PROJECT=${LANGSMITH_PROJECT}
      - LANGSMITH_ENDPOINT=https://eu.api.smith.langchain.com
      - AGENT_DB_URL=${AGENT_DB_URL}
    depends_on:
      - order-service
      - payment-service
      - inventory-service
      - agent-db
    networks:
      - default

  agent-ui:
      build: ./services/agent-ui
      ports:
        - "8501:8501"
      environment:
        - AGENT_SERVICE_URL=http://ai-agent-service:8000
      depends_on:
        - ai-agent-service
      networks:
        - default
 
  agent-db:
    image: pgvector/pgvector:pg16
    environment:
      - POSTGRES_USER=agent
      - POSTGRES_PASSWORD=${AGENT_DB_PASSWORD:-agent}
      - POSTGRES_DB=agent_knowledge
    ports:
      - "5433:5432"   # 5433 to avoid clashing with order-service's Postgres on 5432
    volumes:
      - agent-db-data:/var/lib/postgresql/data

volumes:
  postgres-data:
  payment-postgres-data:
  kafka-data:
  data-lake:
  agent-db-data: