[project]
name = "ai-agent-service"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "langgraph",
    "langchain-anthropic",
    "langsmith",
    "psycopg[binary]",
    "pgvector",
    "httpx",
    "pydantic-settings",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]