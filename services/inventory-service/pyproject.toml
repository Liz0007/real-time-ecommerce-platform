[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "inventory-service"
version = "0.1.0"
description = "Consumes order-created events, simulates stock reservation, publishes inventory-reserved"
requires-python = ">=3.12,<3.13"

dependencies = [
    "fastapi>=0.115,<1.0",
    "uvicorn[standard]>=0.34,<1.0",
    "pydantic-settings>=2.6,<3.0",
    "aiokafka>=0.11,<1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.3,<9.0", "pytest-asyncio>=0.24,<1.0", "httpx>=0.28,<1.0"]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py312"